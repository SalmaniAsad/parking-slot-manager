<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Slot Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; }
        .slot { padding: 15px; border-radius: 8px; font-weight: bold; width: 120px; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .available { background-color: #28a745; }
        .occupied { background-color: #dc3545; }
        .form-group { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; }
        input, select, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        .btn-add { background-color: #007bff; color: white; cursor: pointer; border: none; font-weight: bold; }
        .btn-add:hover { background-color: #0056b3; }
        .btn-delete { margin-top: 10px; padding: 5px 10px; font-size: 12px; background-color: rgba(255,255,255,0.25); color: white; border: 1px solid white; cursor: pointer; border-radius: 4px; }
        .btn-delete:hover { background-color: white; color: #333; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Parking Slot Manager</h1>
    
    <!-- Display Parking Slots -->
    <div class="grid" id="slots-container">
        <!-- Slots will be loaded here dynamically via JavaScript -->
    </div>

    <!-- Add New Slot Form -->
    <div class="form-group">
        <h3>Add New Parking Slot</h3>
        <input type="number" id="slot-id" placeholder="Slot ID (e.g., 3)" required>
        <select id="slot-status">
            <option value="Available">Available</option>
            <option value="Occupied">Occupied</option>
        </select>
        <button class="btn-add" onclick="addSlot()">Add Slot</button>
    </div>
</div>

<script>
    // Fetch slots from the GET /items API backend
    async function loadSlots() {
        const response = await fetch('/items');
        const slots = await response.json();
        const container = document.getElementById('slots-container');
        container.innerHTML = '';

        // Sort the slots numerically by ID so they always display in order
        slots.sort((a, b) => a.id - b.id);

        slots.forEach(slot => {
            const div = document.createElement('div');
            // Apply green background for Available, red for Occupied
            div.className = `slot ${slot.status.toLowerCase()}`;
            
            // Render the slot details and the Remove button
            div.innerHTML = `
                <span>Slot ${slot.id}</span>
                <small>${slot.status}</small>
                <button class="btn-delete" onclick="deleteSlot(${slot.id})">Remove</button>
            `;
            container.appendChild(div);
        });
    }

    // Send new slot to the POST /items API backend
    async function addSlot() {
        const id = document.getElementById('slot-id').value;
        const status = document.getElementById('slot-status').value;

        if (!id) return alert("Please enter a Slot ID.");

        const response = await fetch('/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: parseInt(id), status: status })
        });

        // Check if the backend rejected the duplicate slot
        if (!response.ok) {
            const errorData = await response.json();
            alert(errorData.message); // Show the error pop-up
            return;
        }

        document.getElementById('slot-id').value = ''; // clear input
        loadSlots(); // refresh the UI
    }

    // Send delete request to DELETE /items/<id> API backend
    async function deleteSlot(id) {
        await fetch(`/items/${id}`, {
            method: 'DELETE'
        });
        loadSlots(); // refresh the UI after deleting
    }

    // Load slots automatically when the page opens
    window.onload = loadSlots;
</script>

</body>
</html>
